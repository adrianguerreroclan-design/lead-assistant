<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comfort Pro — Schedule Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #EEF2F7;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Widget shell ── */
    .widget {
      width: 100%;
      max-width: 460px;
      height: min(680px, calc(100dvh - 40px));
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #DDE3EC;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 2px 4px rgba(15,23,42,0.04),
        0 8px 24px rgba(15,23,42,0.08),
        0 24px 48px rgba(15,23,42,0.06);
    }

    /* ── Header ── */
    .header {
      padding: 18px 22px;
      background: #0F172A;
      display: flex;
      align-items: center;
      gap: 13px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0369A1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg {
      width: 20px;
      height: 20px;
      color: #FFFFFF;
      stroke: currentColor;
    }

    .header-content { flex: 1; min-width: 0; }
    .header-content h1 {
      font-size: 15.5px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.3px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-content p {
      font-size: 12px;
      color: #64748B;
      margin-top: 2px;
      font-weight: 400;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22C55E;
      flex-shrink: 0;
    }
    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: #22C55E;
      letter-spacing: 0.1px;
    }

    /* ── Qualification rail ── */
    .qual-rail {
      display: flex;
      gap: 6px;
      padding: 11px 18px;
      background: #F8FAFC;
      border-bottom: 1px solid #E8EDF4;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .qual-rail::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      background: #FFFFFF;
      border: 1px solid #DDE3EC;
      color: #94A3B8;
      cursor: default;
      user-select: none;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      flex-shrink: 0;
    }
    .chip svg { width: 10px; height: 10px; flex-shrink: 0; }

    .chip.done {
      background: #EFF6FF;
      border-color: #93C5FD;
      color: #1D4ED8;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #FFFFFF;
      scrollbar-width: thin;
      scrollbar-color: #DDE3EC transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      background: #DDE3EC;
      border-radius: 2px;
    }

    .msg {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      animation: msgIn 0.2s ease both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; }
    }

    .msg.assistant {
      background: #F1F5F9;
      color: #1E293B;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #0369A1;
      color: #FFFFFF;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    /* ── Typing indicator ── */
    .msg.typing {
      padding: 14px 17px;
      background: #F1F5F9;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .dots { display: flex; align-items: center; gap: 4px; }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94A3B8;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.18s; }
    .dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0);    opacity: 0.45; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dots span { animation: none; opacity: 1; }
    }

    /* ── Slot picker ── */
    .slots {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .slot-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1.5px solid #BFDBFE;
      color: #1D4ED8;
      border-radius: 10px;
      padding: 9px 13px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.16s ease, border-color 0.16s ease;
    }
    .slot-btn:hover {
      background: #EFF6FF;
      border-color: #93C5FD;
    }
    .slot-btn:active { background: #DBEAFE; }
    .slot-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: #3B82F6;
      stroke: currentColor;
    }

    /* ── Input bar ── */
    .input-area {
      padding: 11px 14px 15px;
      background: #FFFFFF;
      border-top: 1px solid #E8EDF4;
      flex-shrink: 0;
    }
    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #F8FAFC;
      border: 1.5px solid #DDE3EC;
      border-radius: 14px;
      padding: 9px 9px 9px 15px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .input-wrapper:focus-within {
      border-color: #0369A1;
      box-shadow: 0 0 0 3px rgba(3,105,161,0.1);
      background: #FFFFFF;
    }

    #msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #1E293B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      resize: none;
      height: 22px;
      padding: 0;
      overflow-y: hidden;
    }
    #msgInput::placeholder { color: #C1CBD9; }

    #sendBtn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #0369A1;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.1s ease;
    }
    #sendBtn:hover:not(:disabled) { background: #075985; }
    #sendBtn:active:not(:disabled) { transform: scale(0.93); }
    #sendBtn:disabled {
      background: #CBD5E1;
      cursor: not-allowed;
    }
    #sendBtn svg { width: 14px; height: 14px; }

    /* ── Mobile: full-screen ── */
    @media (max-width: 499px) {
      body { padding: 0; align-items: flex-end; background: #F1F5F9; }
      .widget {
        max-width: 100%;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<div class="widget">

  <!-- Header -->
  <div class="header">
    <div class="logo-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div class="header-content">
      <h1>Comfort Pro</h1>
      <p>Greater Phoenix metro · (602) 555-0142</p>
    </div>
    <div class="status-badge" aria-label="Agent online">
      <div class="status-dot" aria-hidden="true"></div>
      <span class="status-text">Online</span>
    </div>
  </div>

  <!-- Qualification rail -->
  <div class="qual-rail" id="qualRail" role="list" aria-label="Qualification progress">
    <div class="chip" id="chip-name" role="listitem">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3z"/>
      </svg>
      Name
    </div>
    <div class="chip" id="chip-service" role="listitem">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M10.5 1.5a.5.5 0 00-.5.5v1H6V2a.5.5 0 00-1 0v1H3.5A1.5 1.5 0 002 4.5v8A1.5 1.5 0 003.5 14h9a1.5 1.5 0 001.5-1.5v-8A1.5 1.5 0 0012.5 3H11V2a.5.5 0 00-.5-.5z"/>
      </svg>
      Service
    </div>
    <div class="chip" id="chip-address" role="listitem">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 1a5 5 0 100 10A5 5 0 008 1zm0 1.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zM8 5a1 1 0 100 2 1 1 0 000-2z"/>
      </svg>
      Address
    </div>
    <div class="chip" id="chip-urgency" role="listitem">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm.5 4v4.25l3 1.75-.5.87L7.5 10V5h1z"/>
      </svg>
      Urgency
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="msgInput" placeholder="Message Comfort Pro…" rows="1" aria-label="Type a message"></textarea>
      <button id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  let sessionId = null;
  let polling = null;
  const CHIP_KEYS = ['name', 'service', 'address', 'urgency'];

  const messagesEl = document.getElementById('messages');
  const input      = document.getElementById('msgInput');
  const sendBtn    = document.getElementById('sendBtn');

  function addMessage(role, content, extra) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (extra === 'typing') {
      div.classList.add('typing');
      div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
      div.id = 'typing-indicator';
    } else {
      div.textContent = content;
      if (extra && extra.slots) {
        const slotsDiv = document.createElement('div');
        slotsDiv.className = 'slots';
        extra.slots.forEach(s => {
          const btn = document.createElement('button');
          btn.className = 'slot-btn';
          // SVG calendar icon (slot labels are system-generated, not user input)
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
          const labelNode = document.createTextNode(s.label);
          btn.appendChild(labelNode);
          btn.onclick = () => confirmSlot(s.iso, s.label);
          slotsDiv.appendChild(btn);
        });
        div.appendChild(slotsDiv);
      }
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function updateRail(lead) {
    if (!lead) return;
    CHIP_KEYS.forEach(k => {
      const chip = document.getElementById(`chip-${k}`);
      if (chip) chip.classList.toggle('done', !!lead[k]);
    });
  }

  function extractSlots(text) {
    try {
      const match = text.match(/\[\s*\{.*?"iso".*?\}\s*\]/s);
      if (match) return JSON.parse(match[0]);
    } catch {}
    return null;
  }

  async function send(msg) {
    if (!msg.trim()) return;
    addMessage('user', msg);
    input.value = '';
    input.style.height = '22px';
    sendBtn.disabled = true;
    addMessage('assistant', '', 'typing');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message: msg }),
      });
      const data = await res.json();
      removeTyping();
      if (data.error) { addMessage('assistant', 'Sorry, something went wrong. Please try again.'); return; }
      sessionId = data.sessionId;
      updateRail(data.lead);
      const slots    = extractSlots(data.reply);
      const cleanText = data.reply.replace(/\[\s*\{.*?"iso".*?\}\s*\]/s, '').trim();
      addMessage('assistant', cleanText || data.reply, slots ? { slots } : null);
      startPolling();
    } catch {
      removeTyping();
      addMessage('assistant', 'Connection error. Please try again.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function confirmSlot(iso, label) {
    if (!sessionId) return;
    addMessage('user', `Book the ${label} slot`);
    addMessage('assistant', '', 'typing');
    try {
      const res = await fetch('/api/book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, slotIso: iso, slotLabel: label }),
      });
      const data = await res.json();
      removeTyping();
      updateRail(data.lead);
      addMessage('assistant', data.message || 'Booking confirmed!');
    } catch {
      removeTyping();
      addMessage('assistant', 'Could not confirm the booking. Please try again.');
    }
  }

  function startPolling() {
    if (polling || !sessionId) return;
    polling = setInterval(async () => {
      if (!sessionId) return;
      try {
        const res = await fetch(`/api/session/${sessionId}`);
        const data = await res.json();
        updateRail(data.lead);
        (data.pending || []).forEach(m => addMessage('assistant', m.content));
      } catch {}
    }, 3000);
  }

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = '22px';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });

  sendBtn.onclick = () => send(input.value);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });

  window.addEventListener('load', () => {
    addMessage('assistant', "Hi! I'm your Comfort Pro scheduling assistant. I'll help you get service booked fast — what's your name?");
  });
</script>
</body>
</html>
